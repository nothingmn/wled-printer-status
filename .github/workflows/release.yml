name: Publish to Plugin Marketplace

# Publishing a GitHub release whose tag ends with the version in module.yaml
# hands that commit to the marketplace's builder. The builder builds the
# program for every platform module.yaml declares and publishes it together
# with the commit's source, so the marketplace knows exactly what the release
# was built from. A person at Prusa reviews it before operators can install it.
#
# Pushing a branch publishes nothing. Only `release: published` starts this,
# and creating a release is the operator's act.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish
    # The builder checks prusa3d/prusa-connect out at core-ref into .core/, and
    # this module's go.mod replaces the sdk with ./.core/sdk, so core-ref
    # decides which SDK the published binary is built against.
    #
    # sdk/v0.1.0-beta.1 peels to b194cb83, and sdk/ is identical between that
    # tag and the commit these tests run against, so the release is built
    # against exactly the SDK proven here. The tag v0.1.0-beta.1 names the same
    # commit and the same sdk/ tree. Raise this when the SDK moves.
    uses: prusa3d/prusa-connect-marketplace-publish/.github/workflows/publish.yml@v1
    with:
      path: .
      core-ref: sdk/v0.1.0-beta.1
      # module.yaml carries a ui block, so the builder's bundle job runs: it
      # installs and builds ui/, then takes only ui/dist/ui out of that job and
      # puts it in the release as ui/. Both values are the builder's defaults,
      # written out so that the contract is visible here rather than inferred.
      #
      #   bundle-command  run in the extension's folder, with Node and pnpm from
      #                   the runner and no secret and no token, because it runs
      #                   this repository's own code
      #   bundle-output   where that command leaves module.yaml and the entry,
      #                   relative to the folder: ui/dist, holding dist/ui/index.js,
      #                   which module.yaml's `ui.entry: ui/index.js` names
      #
      # --frozen-lockfile is why ui/pnpm-lock.yaml is committed. A bundle that
      # does not build fails the release; the program job is untouched either
      # way, so a module whose bundle breaks can still be published as a
      # process-only module by deleting the ui block.
      bundle-command: cd ui && pnpm install --frozen-lockfile && pnpm run build
      bundle-output: ui/dist
      node-version: '22'
    # The environment `release` holds PRUSA_CONNECT_EXTENSION_SIGNING_KEY, and
    # the builder runs the publish job in it. This job does not name the
    # environment itself, because the builder sets it.
    #
    # The secret is passed by name: `secrets: inherit` does not reach a
    # workflow outside the caller's organisation.
    secrets:
      PRUSA_CONNECT_EXTENSION_SIGNING_KEY: ${{ secrets.PRUSA_CONNECT_EXTENSION_SIGNING_KEY }}
    permissions:
      contents: read
      id-token: write     # lets the run prove which repository, workflow and builder it is
      attestations: write # the build provenance of the archive and every binary
